[package]
name = "luma-kit"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
description = "Unified facade for the luma ML framework: tensors, nn, optim, datasets, and tracing"
keywords = { workspace = true }
license = { workspace = true }

[lib]
name = "luma"

[dependencies]
luma-tensor = { workspace = true }
luma-nn = { workspace = true, optional = true }
luma-optim = { workspace = true, optional = true }
luma-dataset = { workspace = true, optional = true }
luma-io = { workspace = true, optional = true }
luma-compile = { workspace = true, optional = true }

[features]
default = ["io"]
io = ["dep:luma-io"]
nn = ["dep:luma-nn", "dep:luma-optim", "dep:luma-dataset"]
compile = ["dep:luma-compile", "nn"]
cuda = ["luma-tensor/cuda", "luma-nn?/cuda", "luma-compile?/cuda"]
full = ["nn", "compile"]