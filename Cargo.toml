[workspace]
members = [
    "luma",
    "luma-tensor",
    "luma-cpu",
    "luma-cuda",
    "luma-nn",
    "luma-optim",
    "luma-dataset",
    "luma-macros",
    "luma-io",
    "luma-compile",
    "luma-onnx",
    "luma-ml",
    "luma-flash-attn",
]

default-members = [
    "luma",
    "luma-tensor",
    "luma-cpu",
    "luma-nn",
    "luma-optim",
    "luma-dataset",
    "luma-macros",
    "luma-io",
    "luma-compile",
    "luma-onnx",
    "luma-ml",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
repository = "https://github.com/MoleSir/luma.git"
description = "A tiny ML framework"
keywords = ["machine-learning", "auto-grad"]
license = "MIT"

[workspace.dependencies]
luma-tensor = { path = "./luma-tensor", package = "luma-tensor", version = "0.3.0" }
luma-cpu = { path = "./luma-cpu", package = "luma-cpu", version = "0.3.0" }
luma-cuda = { path = "./luma-cuda", package = "luma-cuda", version = "0.3.0" }
luma-nn = { path = "./luma-nn", package = "luma-nn", version = "0.3.0" }
luma-optim = { path = "./luma-optim", package = "luma-optim", version = "0.3.0" }
luma-dataset = { path = "./luma-dataset", package = "luma-dataset", version = "0.3.0" }
luma-macros = { path = "./luma-macros", package = "luma-macros", version = "0.3.0" }
luma-io = { path = "./luma-io", package = "luma-io", version = "0.3.0" }
luma-compile = { path = "./luma-compile", package = "luma-compile", version = "0.3.0" }
luma-onnx = { path = "./luma-onnx", package = "luma-onnx", version = "0.3.0" }
luma-ml = { path = "./luma-ml", package = "luma-ml", version = "0.3.0" }
luma-flash-attn = { path = "./luma-flash-attn", package = "luma-flash-attn", version = "0.3.0" }

thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["std"] }
rand = "0.9.2"
rand_distr = "0.5.1"
gemm = "0.19"
libm = "0.2.15"
num_cpus = "1.17"
paste = "1.0.15"
bytemuck = "1"
half = { version = "2.7", features = ["bytemuck"] }
cudarc = "0.19.8"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
proc-macro-crate = "3.3"
thiserrorctx = "2.0"
dirs = "6.0"
reqwest = "0.12"
indicatif = "0.18"
flate2 = "1.1"
memmap2 = "0.9.9"
derive_builder = "0.20"
prost = "0.12.1"
